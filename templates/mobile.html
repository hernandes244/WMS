<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>WMS Mobile</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;font:16px Arial;background:#eef1f5;color:#111827}header{background:#111827;color:#fff;padding:15px;display:flex;justify-content:space-between}.wrap{max-width:620px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}button,input,select{width:100%;padding:13px;margin-top:7px;border-radius:10px;border:1px solid #ccd1d8;font-size:16px;box-sizing:border-box}button{background:#111827;color:white;font-weight:bold;border:0}.secondary{background:#e5e7eb;color:#111827}.nav{display:grid;grid-template-columns:1fr 1fr;gap:7px}.nav button{margin:0}.hidden{display:none}.result{padding:11px;margin-top:9px;border-radius:9px;background:#f8fafc}.ok{border-left:5px solid #16a34a}.error{border-left:5px solid #dc2626}.item{padding:10px 0;border-bottom:1px solid #eee}.pill{background:#e5e7eb;border-radius:20px;padding:5px 8px;font-size:12px}#reader{margin-top:8px;overflow:hidden;border-radius:10px}</style></head><body><header><b>📦 WMS Mobile</b><span id="user"></span></header><div class="wrap"><div id="login" class="card"><h2>Login</h2><input id="username" placeholder="Usuário"><input id="password" type="password" placeholder="Senha"><button onclick="login()">ENTRAR</button><div id="loginMsg"></div></div><div id="app" class="hidden"><div class="card nav"><button onclick="tab('home')">🏠 Menu</button><button onclick="tab('consulta')">🔎 Consulta</button><button onclick="tab('recebimento')">📥 Recebimento</button><button onclick="tab('armazenagem')">📦 Armazenagem</button><button onclick="tab('inventario')">📋 Inventário</button><button onclick="tab('separacao')">🛒 Separação</button><button onclick="tab('imei')">📱 IMEI</button><button class="secondary" onclick="logout()">SAIR</button></div><section id="home" class="card"><h2>Operação móvel</h2><p>Use a câmera para produtos, endereços, QR Codes, EAN e IMEI.</p><div class="result ok">Pronto para operar.</div></section><section id="camera" class="card hidden"><b>📷 Câmera</b><div id="reader"></div><button class="secondary" onclick="closeCam()">FECHAR</button></section><section id="consulta" class="card hidden"><h2>Consulta de estoque</h2><button onclick="scan(lookup)">📷 ESCANEAR PRODUTO</button><input id="qcode" placeholder="EAN / QR / código"><button class="secondary" onclick="lookup(qcode.value)">CONSULTAR</button><div id="qresult"></div></section><section id="recebimento" class="card hidden"><h2>Recebimento</h2><select id="receipt"></select><button onclick="scan(p=>setP('r',p))">📷 PRODUTO</button><div id="rp" class="result">Nenhum produto</div><input id="rq" type="number" min="0.001" step="0.001" placeholder="Quantidade"><input id="rlot" placeholder="Lote"><input id="rexp" type="date"><select id="raddr"></select><div id="rimei" class="hidden"><b>Controle de IMEI</b><input id="ri" placeholder="IMEI"><button class="secondary" onclick="scan(addImei)">📷 LER IMEI</button><div id="ilist"></div></div><button onclick="receive()">CONFIRMAR RECEBIMENTO</button><div id="rmsg"></div></section><section id="armazenagem" class="card hidden"><h2>Armazenagem / movimentação</h2><button onclick="scan(p=>setP('m',p))">📷 PRODUTO</button><div id="mp" class="result">Nenhum produto</div><select id="ms"></select><input id="mq" type="number" min="0.001" step="0.001" placeholder="Quantidade"><select id="md"></select><button onclick="transfer()">CONFIRMAR MOVIMENTAÇÃO</button><div id="mmsg"></div></section><section id="inventario" class="card hidden"><h2>Inventário</h2><button onclick="scan(p=>setP('i',p))">📷 PRODUTO</button><div id="ip" class="result">Nenhum produto</div><select id="ia"></select><input id="iq" type="number" min="0" step="0.001" placeholder="Quantidade contada"><input id="ilot" placeholder="Lote opcional"><button onclick="inventory()">CONFIRMAR CONTAGEM</button><div id="imsg"></div></section><section id="separacao" class="card hidden"><h2>Separação</h2><button onclick="orders()">🔄 PEDIDOS</button><div id="olist"></div><button onclick="createPicking()">GERAR SEPARAÇÃO</button><div id="pmsg"></div><hr><button onclick="pickings()">🔄 TAREFAS DE SEPARAÇÃO</button><div id="plist"></div></section><section id="imei" class="card hidden"><h2>Validação de IMEI</h2><button onclick="scan(validateImei)">📷 ESCANEAR IMEI</button><input id="icheck" placeholder="IMEI"><button class="secondary" onclick="validateImei(icheck.value)">VALIDAR</button><div id="iresult"></div></section></div></div><script>const API='/api/mobile/';let token=localStorage.getItem('wms_token')||'',cam=null,rp=null,mp=null,ip=null,imeis=[];const $=x=>document.getElementById(x);function H(){return{Authorization:'Token '+token,'Content-Type':'application/json'}}async function api(path,opt={}){opt.headers={...(opt.headers||{}),...H()};let r=await fetch(API+path,opt),d={};try{d=await r.json()}catch(e){}return[r,d]}function msg(id,t,ok){$(id).className='result '+(ok?'ok':'error');$(id).innerHTML=t}async function login(){let r=await fetch(API+'login/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})}),d=await r.json();if(!r.ok)return msg('loginMsg',d.error||'Login inválido');token=d.token;localStorage.setItem('wms_token',token);start()}async function start(){let[r,d]=await api('me/');if(!r.ok)return logout();$('user').textContent=d.user;$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAddresses();loadReceipts()}function logout(){localStorage.removeItem('wms_token');location.reload()}function tab(t){['home','consulta','recebimento','armazenagem','inventario','separacao','imei'].forEach(x=>$(x).classList.toggle('hidden',x!==t));closeCam();if(t==='recebimento')loadReceipts();if(t==='separacao'){orders();pickings()}}function closeCam(){if(cam){cam.stop().catch(()=>{});cam.clear().catch(()=>{});cam=null}$('camera').classList.add('hidden')}function scan(cb){closeCam();$('camera').classList.remove('hidden');cam=new Html5Qrcode('reader');cam.start({facingMode:'environment'},{fps:12,qrbox:{width:270,height:190}},x=>{closeCam();cb(x)},()=>{}).catch(()=>msg('qresult','Câmera bloqueada. No celular use HTTPS e permita a câmera.',false))}async function lookup(code){code=String(code||'').trim();if(!code)return;let[r,d]=await api('scan/?code='+encodeURIComponent(code));if(!r.ok)return msg('qresult',d.error,false);let h='<b>'+d.product.description+'</b><br>'+d.product.code+'<br><br>';d.stock.forEach(s=>h+='📍 '+s.address+' — disponível <b>'+s.available+'</b> — total '+s.quantity+(s.lot?' — lote '+s.lot:'')+'<br>');msg('qresult',h||'Sem estoque',true)}async function loadAddresses(){let[r,d]=await api('addresses/');if(!r.ok)return;let o='<option value="">Selecione</option>'+d.addresses.map(a=>'<option value="'+a.id+'">'+a.code+'</option>').join('');['raddr','ms','md','ia'].forEach(id=>$(id).innerHTML=o)}async function loadReceipts(){let[r,d]=await api('receipts/');if(!r.ok)return;$('receipt').innerHTML='<option value="">Entrada</option>'+d.receipts.map(x=>'<option value="'+x.id+'">'+x.number+' — '+x.supplier+'</option>').join('')}function setP(k,p){if(k==='r'){rp=p;$('rp').innerHTML='<b>'+p.description+'</b><br>'+p.code;$('rimei').classList.toggle('hidden',!p.imei_control)}if(k==='m'){mp=p;$('mp').innerHTML='<b>'+p.description+'</b><br>'+p.code}if(k==='i'){ip=p;$('ip').innerHTML='<b>'+p.description+'</b><br>'+p.code}}function luhn(v){if(!/^\d{15}$/.test(v))return false;let s=0;for(let i=0;i<15;i++){let n=+v[i];if(i%2===0){n*=2;if(n>9)n-=9}s+=n}return s%10===0}function addImei(v){v=String(v).replace(/\D/g,'');if(!luhn(v))return msg('rmsg','IMEI inválido.',false);if(!imeis.includes(v))imeis.push(v);$('ilist').innerHTML=imeis.map((x,i)=>'<span class="pill">'+x+' <a href="#" onclick="imeis.splice('+i+',1);addImeiList();return false">×</a></span>').join('')}function addImeiList(){$('ilist').innerHTML=imeis.map(x=>'<span class="pill">'+x+'</span>').join('')}async function receive(){if(!rp)return msg('rmsg','Leia o produto.',false);let body={receipt_id:$('receipt').value,product_id:rp.id,address_id:$('raddr').value,quantity:$('rq').value,lot_code:$('rlot').value,expiry:$('rexp').value,imeis:imeis};let[r,d]=await api('receive/',{method:'POST',body:JSON.stringify(body)});msg('rmsg',d.message||d.error,r.ok);if(r.ok){imeis=[];addImeiList()}}async function transfer(){if(!mp)return msg('mmsg','Leia o produto.',false);let[r,d]=await api('transfer/',{method:'POST',body:JSON.stringify({product_id:mp.id,source_id:$('ms').value,destination_id:$('md').value,quantity:$('mq').value})});msg('mmsg',d.message||d.error,r.ok)}async function inventory(){if(!ip)return msg('imsg','Leia o produto.',false);let[r,d]=await api('inventory/',{method:'POST',body:JSON.stringify({product_id:ip.id,address_id:$('ia').value,counted_quantity:$('iq').value,lot_code:$('ilot').value})});msg('imsg',d.message||d.error,r.ok)}async function orders(){let[r,d]=await api('orders/');if(!r.ok)return;let h='';d.orders.forEach(o=>{h+='<div class="item"><label><input type="checkbox" class="oc" value="'+o.id+'" style="width:auto"> <b>Pedido '+o.number+'</b></label><br>'+o.items.map(i=>'• '+i.product.description+' — '+i.quantity+' '+i.product.unit).join('<br>')+'</div>'});$('olist').innerHTML=h||'<div class="result">Nenhum pedido pendente.</div>'}async function createPicking(){let ids=[...document.querySelectorAll('.oc:checked')].map(x=>+x.value);let[r,d]=await api('picking/create/',{method:'POST',body:JSON.stringify({order_ids:ids})});msg('pmsg',d.message||d.error,r.ok);if(r.ok)pickings()}async function pickings(){let[r,d]=await api('pickings/');if(!r.ok)return;let h='';d.pickings.forEach(p=>{h+='<div class="item"><b>'+p.number+'</b> <span class="pill">'+p.status+'</span>';p.items.forEach(i=>{h+='<div class="result"><b>Pedido '+i.order+'</b><br>📍 '+i.address+'<br>📦 '+i.product.description+'<br>Separado '+i.picked+'/'+i.quantity+'<button onclick="executePick('+i.id+',\''+i.address+'\')">SEPARAR</button></div>'});h+='</div>'});$('plist').innerHTML=h||'<div class="result">Nenhuma tarefa.</div>'}async function executePick(id,address){let code=prompt('Leia/digite o código do produto:');if(code===null)return;let addr=prompt('Confirme o endereço:',address);if(addr===null)return;let qty=prompt('Quantidade:','1');if(qty===null)return;let[r,d]=await api('picking/pick/',{method:'POST',body:JSON.stringify({picking_item_id:id,code:code,address:addr,quantity:qty})});alert(r.ok?'✓ '+d.message:'⛔ '+d.error);if(r.ok)pickings()}async function validateImei(v){v=String(v||$('icheck').value).replace(/\D/g,'');$('icheck').value=v;let[r,d]=await api('imei/validate/',{method:'POST',body:JSON.stringify({imei:v})});msg('iresult',d.error||(d.product.description+' — '+d.status),r.ok)}if(token)start();</script></body></html>
